[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pegarex-mcp"
version = "0.1.0"
description = "stdio bridge to the hosted PegaRex MCP server: live Brazilian used-car and motorcycle listings with FIPE prices"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["mcp>=1.30,<2"]
keywords = ["mcp", "model-context-protocol", "used-cars", "brazil", "fipe"]

[project.scripts]
pegarex-mcp = "pegarex_mcp.server:main"

[project.urls]
Homepage = "https://pegarex.com.br/mcp"
Repository = "https://github.com/paya-alavi77/pegarex-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/pegarex_mcp"]
